name: Secure Payment CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4   # ✅ UPDATED

    # 🔧 Backend
    - name: Setup .NET
      uses: actions/setup-dotnet@v4   # ✅ UPDATED
      with:
        dotnet-version: '8.0.x'

    - name: Restore backend
      run: dotnet restore ./SecureAPI/SecureAPI.csproj

    - name: Build backend
      run: dotnet build ./SecureAPI/SecureAPI.csproj --configuration Release --no-restore

    # ⚛️ Frontend
    - name: Setup Node
      uses: actions/setup-node@v4   # ✅ UPDATED
      with:
        node-version: '18'

    - name: Install frontend
      run: |
        cd client
        npm install

    - name: Build frontend
      run: |
        cd client
        npm run build